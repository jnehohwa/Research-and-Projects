[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "educore"
version = "0.1.0"
description = "Enterprise training management prototype for ITEPA3-33"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "Pillow>=10.0",
    "reportlab>=4.0",
    "pypdf>=5.0",
]

[project.scripts]
educore-demo = "educore.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["educore"]
omit = ["src/educore/demo.py"]
